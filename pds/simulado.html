<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Simulado PDS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: uma questão por vez, coluna única; tela inicial com filtros, tela final com revisão dos erros */
:root{
  --bg:#f3f6f9; --surface:#ffffff; --surface2:#e9eef4; --fg:#142230; --muted:#4d6073; --line:#d3dce6;
  --accent:#1f5fbf; --accent-soft:#dbe8fb; --ok:#17784a; --ok-soft:#dcf2e6; --bad:#b42318; --bad-soft:#fbe3e1;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Schibsted Grotesk","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1620; --surface:#15212d; --surface2:#1c2b3a; --fg:#e6eef6; --muted:#9db0c3; --line:#2a3b4d;
  --accent:#6ea6f5; --accent-soft:#1b3050; --ok:#5fcf96; --ok-soft:#173a2b; --bad:#f08a80; --bad-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1620; --surface:#15212d; --surface2:#1c2b3a; --fg:#e6eef6; --muted:#9db0c3; --line:#2a3b4d;
  --accent:#6ea6f5; --accent-soft:#1b3050; --ok:#5fcf96; --ok-soft:#173a2b; --bad:#f08a80; --bad-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-block:36px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,2.6rem);letter-spacing:-.02em}
h2{font-size:1.3rem}
p{margin:0}
.label{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:999px;padding:8px 14px;font:inherit;font-size:.92rem;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0e1620}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0e1620}}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--accent);color:#fff;min-height:46px}
:root[data-theme="dark"] .btn{color:#0e1620}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0e1620}}
.btn.sec{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.q{font-family:var(--display);font-size:1.25rem;line-height:1.3}
pre{margin:0;font-family:var(--mono);font-size:.8rem;line-height:1.45;background:var(--surface2);border-radius:10px;padding:14px;overflow-x:auto;white-space:pre}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;font:inherit;background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.opt b{font-family:var(--mono);color:var(--muted);flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.exp{border-radius:12px;padding:14px 16px;background:var(--surface2)}
.tip{margin-top:10px;border-left:3px solid var(--accent);padding:4px 0 4px 12px}
.tip b{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.exp.ok{background:var(--ok-soft)} .exp.no{background:var(--bad-soft)}
.score{font-family:var(--display);font-size:3rem;line-height:1}
.err{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.err:first-child{border-top:0;padding-top:0}
.tag{display:inline-block;font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:.9rem}
[hidden]{display:none!important}
</style>

</head>
<body>
<div class="wrap">

<a href="../" style="color:var(--accent);font-weight:600;text-decoration:none">← Início</a>
<header style="display:flex;flex-direction:column;gap:10px">
  <span class="label">Processo de Desenvolvimento de Software</span>
  <h1>Simulado PDS</h1>
  <p class="muted">Questões de conceitos e fundamentos da matéria, com foco em DevOps e exemplos do FrequênciaFácil. Uma questão por vez, sem tempo.</p>
</header>

<!-- INÍCIO -->
<section id="start" class="card">
  <h2>Monte o seu simulado</h2>
  <div style="display:flex;flex-direction:column;gap:8px">
    <span class="label">Assuntos</span>
    <div class="chips" id="topics"></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <span class="label">Quantidade</span>
    <div class="chips" id="sizes"></div>
  </div>
  <p class="muted" id="avail"></p>
  <div class="row"><button class="btn" id="go">Começar simulado →</button></div>
</section>

<!-- QUESTÃO -->
<section id="quiz" hidden style="display:flex;flex-direction:column;gap:16px">
  <div class="row" style="justify-content:space-between">
    <span class="tag" id="qtopic"></span>
    <span class="muted" id="qcount" style="font-size:.9rem"></span>
  </div>
  <div class="bar"><i id="qbar"></i></div>
  <p class="q" id="qtext"></p>
  <pre id="qdiag" hidden></pre>
  <div class="opts" id="qopts"></div>
  <div class="exp" id="qexp" hidden></div>
  <div class="row">
    <button class="btn" id="confirm" disabled>Confirmar</button>
    <button class="btn" id="next" hidden>Próxima →</button>
    <button class="btn sec" id="quit" style="margin-left:auto">Encerrar</button>
  </div>
</section>

<!-- RESULTADO -->
<section id="result" hidden style="display:flex;flex-direction:column;gap:18px">
  <div class="card">
    <span class="label">Resultado</span>
    <div class="row" style="align-items:baseline;gap:14px"><span class="score" id="rscore"></span><span class="muted" id="rpct"></span></div>
    <p id="rmsg"></p>
    <div class="stats" id="rstats"></div>
    <div class="row">
      <button class="btn" id="redo">Refazer as erradas</button>
      <button class="btn sec" id="again">Novo simulado</button>
    </div>
  </div>
  <div class="card" id="rerrs"></div>
</section>

</div>

<script>
const BANK = [
{"t": "Processo", "q": "Segundo o IEEE, Engenharia de Software é:", "o": ["Abordagem sistemática, disciplinada e quantificável ao software", "Abordagem criativa e flexível, sem regras fixas, ao software", "Conjunto de ferramentas que geram e testam código sozinhas", "Documentação completa do sistema antes da codificação"], "e": "A palavra-chave é abordagem sistemática e disciplinada, que cobre todo o ciclo: desenvolver, operar e manter.", "m": "SDQ: Sistemática, Disciplinada e Quantificável. Engenharia não é gambiarra: tem método, regra e medida."},
{"t": "Processo", "q": "Para Pressman, qualidade de software é:", "o": ["Conformidade a requisitos, padrões e expectativas implícitas", "Ausência total de defeitos encontrados nos testes", "Alto desempenho do sistema quando está em produção", "Quantidade e detalhe da documentação do projeto"], "e": "Os requisitos são a base para medir qualidade: se o software não atende aos requisitos, ele não tem qualidade.", "m": "Qualidade é cumprir o combinado: pediu pizza de calabresa e veio de frango? Pode estar gostosa, mas não tem qualidade."},
{"t": "Processo", "q": "Em que momento a qualidade deve ser incorporada ao software?", "o": ["Em todas as fases", "Na fase de testes", "Na fase de projeto", "Na manutenção"], "e": "Qualidade não pode ser incorporada depois do produto pronto: todas as fases afetam o resultado final.", "m": "Não dá pra colocar o fermento depois do bolo assado: qualidade vai na receita, não na cobertura."},
{"t": "Processo", "q": "Qual é a relação entre processo e produto de software?", "o": ["Um bom processo ajuda a ter um bom produto, com requisitos claros", "Um bom processo garante zero defeitos, com ou sem requisitos", "Processo e produto são independentes; depende só de quem programa", "O processo só influencia o produto em projetos muito grandes"], "e": "Processo com qualidade tende a gerar produto com qualidade. O processo é o meio; a qualidade do produto é o objetivo.", "m": "Receita bem seguida dá bolo bom, desde que você saiba qual bolo quer. Processo bom, produto bom."},
{"t": "Processo", "q": "Um processo de software define principalmente:", "o": ["Quem faz o quê, quando e como", "Qual linguagem e framework usar", "Quanto o projeto vai custar", "Em que ordem os testes rodam"], "e": "Processo = atividades, métodos, práticas e tecnologia que as pessoas usam para desenvolver e manter software.", "m": "Processo = Quem, O Quê, Quando e Como. Igual escala de churrasco: quem compra, o que leva, que horas e como assa."},
{"t": "Processo", "q": "Qual é uma consequência típica de desenvolver SEM um processo definido?", "o": ["Retrabalho, prazos e custos imprevisíveis", "Entregas mais rápidas, por haver menos regras", "Menos defeitos, por haver menos burocracia", "Cliente mais satisfeito, por ter mais liberdade"], "e": "Sem processo: procedimentos não documentados, erros repetidos, cronograma e orçamento imprevisíveis, defeitos e desperdício.", "m": "Sem processo é time sem técnico: cada um joga de um jeito, erra igual toda vez e ninguém sabe quando o jogo acaba."},
{"t": "Processo", "q": "Nas fases genéricas do desenvolvimento, a fase de Definição responde principalmente:", "o": ["O QUE o software deve fazer", "COMO o software será codificado", "COMO corrigir erros após a entrega", "QUANDO o sistema será desativado"], "e": "Definição = o quê (requisitos, funções, restrições). Construção = como (projeto, código, testes). Manutenção = mudanças após a entrega.", "m": "Definição = O QUÊ (o cardápio). Construção = COMO (a cozinha). Manutenção = DEPOIS (ajustar o tempero)."},
{"t": "Processo", "q": "O FrequênciaFácil precisa ser alterado para cumprir uma nova lei de proteção de dados. Que tipo de manutenção é essa?", "o": ["Adaptativa", "Corretiva", "Perfectiva", "Preventiva"], "e": "Adaptativa = adaptar a um novo ambiente (tecnologia, legislação, regras de negócio).", "m": "ADAPTAtiva = o sistema se ADAPTA ao mundo lá fora: lei nova, tecnologia nova. Mudou o ambiente, adapta."},
{"t": "Processo", "q": "Adicionar ao FrequênciaFácil um relatório de frequência por período é uma manutenção:", "o": ["Perfectiva", "Corretiva", "Adaptativa", "Preventiva"], "e": "Perfectiva = incluir novas funções ou melhorar as existentes.", "m": "PERFECTiva = deixa mais PERFEITO: função nova ou melhoria. É reformar a casa pra ganhar um quarto."},
{"t": "Processo", "q": "Um aluno não aparecia no histórico por causa de um erro na consulta SQL, e a equipe corrigiu. Que manutenção foi feita?", "o": ["Corretiva", "Perfectiva", "Adaptativa", "Preventiva"], "e": "Corretiva = corrigir defeitos.", "m": "CORRETIVA = CORRIGE o defeito. Cano vazando? Conserta. Dica das 4: C-A-P-P = Corrige, Adapta, Perfeiçoa, Previne."},
{"t": "Processo", "q": "A equipe reorganizou o código para facilitar mudanças futuras, sem alterar o que o sistema faz. Que manutenção é essa?", "o": ["Preventiva", "Corretiva", "Perfectiva", "Adaptativa"], "e": "Preventiva = melhorar a manutenibilidade futura, sem mudar o comportamento para o usuário.", "m": "PREVENTIVA = PREVINE dor de cabeça: igual trocar o óleo do carro antes de o motor fundir."},
{"t": "Processo", "q": "Sobre a norma ISO/IEC 12207, é correto afirmar:", "o": ["Define processos do ciclo de vida, sem dizer como executá-los", "Define processos do ciclo de vida e impõe o modelo cascata", "Define qual metodologia ágil cada empresa deve seguir", "Define os papéis e eventos que substituem o Scrum"], "e": "A 12207 padroniza processos e papéis (quem faz o quê) e deve ser adaptada à organização e ao projeto.", "m": "A 12207 é o mapa da cidade, não o GPS: mostra o que existe (processos e papéis), não o caminho para fazer."},
{"t": "Modelos", "q": "Qual é o principal problema do modelo Cascata?", "o": ["Exige tudo no início e o cliente só vê no fim", "Não tem fase de testes entre o código e a entrega", "Exige análise de risco em cada volta do ciclo", "Descarta o que foi feito ao fim de cada iteração"], "e": "Projetos reais raramente seguem um fluxo sequencial, os requisitos mudam e o cliente espera até o fim para ver algo funcionando.", "m": "Cascata: água não sobe. Passou de fase, não volta, e o cliente só vê o lago lá embaixo, no final."},
{"t": "Modelos", "q": "Qual foi a principal contribuição do modelo Cascata?", "o": ["Trazer disciplina e planejamento", "Aceitar mudanças a qualquer momento", "Eliminar a documentação do projeto", "Introduzir a análise de risco"], "e": "Mesmo com fragilidades, o Cascata é muito melhor que desenvolver sem método: trouxe disciplina e planejamento.", "m": "O Cascata é o avô rígido: está ultrapassado, mas ensinou disciplina e planejamento pra família toda."},
{"t": "Modelos", "q": "Um projeto tem requisitos estáveis e bem definidos desde o início, e o cliente exige documentação completa de cada fase. Qual modelo se encaixa melhor?", "o": ["Cascata", "Prototipação", "Espiral", "Scrum"], "e": "Cascata funciona melhor quando os requisitos são claros e estáveis, pois cada fase depende da anterior.", "m": "Requisito estável e papelada exigida? Cascata: tudo definido no começo, desce em linha reta."},
{"t": "Modelos", "q": "O cliente tem uma ideia geral do sistema, mas não sabe detalhar entradas, processamento e saídas. Qual modelo ajuda a descobrir os requisitos?", "o": ["Prototipação", "Cascata", "RAD", "Técnicas de 4ª geração"], "e": "A prototipação constrói um modelo rápido para o cliente avaliar e refinar os requisitos.", "m": "Cliente diz 'sei lá, algo assim'? Mostre um protótipo. É a maquete antes do prédio."},
{"t": "Modelos", "q": "Na Prototipação, depois que os requisitos são identificados, o protótipo deve ser:", "o": ["Descartado", "Entregue como produto final", "Refinado até virar o produto", "Mantido como ambiente de produção"], "e": "O protótipo é feito rápido, sem foco em qualidade e manutenibilidade. Usá-lo como produto final é um erro clássico.", "m": "Protótipo é maquete: serve pra decidir, não pra morar. Decidiu? Joga fora e constrói de verdade."},
{"t": "Modelos", "q": "Qual elemento o modelo Espiral acrescenta aos modelos Cascata e Prototipação?", "o": ["Análise de risco", "Geração automática de código", "Reuniões diárias", "Implantação contínua"], "e": "Espiral = passos do Cascata numa estrutura iterativa, com prototipação e análise de risco a cada volta.", "m": "Na Espiral, o risco é central: cada volta tem a sua análise de risco."},
{"t": "Modelos", "q": "Qual modelo está representado?", "d": "        1. PLANEJAMENTO          2. ANÁLISE DE RISCOS\n   (objetivos, alternativas,   (avaliar alternativas,\n         restrições)              resolver riscos)\n                 \\                /\n                  \\   ( volta )  /\n                  /  cada volta  \\\n                 /   = uma fase   \\\n   4. AVALIAÇÃO DO CLIENTE      3. CONSTRUÇÃO\n   (decidir se continua)    (produto no nível seguinte)", "o": ["Espiral", "Cascata", "RAD", "Incremental"], "e": "Quatro quadrantes repetidos em voltas, com análise de risco e avaliação do cliente: modelo Espiral.", "m": "Planeja, analisa o risco, constrói, cliente avalia... e gira de novo. Quatro quadrantes girando = Espiral."},
{"t": "Modelos", "q": "Um sistema grande, com muitos riscos técnicos e incertezas. Qual modelo é mais indicado?", "o": ["Espiral", "Cascata", "Prototipação descartável", "RAD"], "e": "O Espiral é realista para sistemas de grande escala porque identifica e trata os riscos a cada etapa.", "m": "Projeto grande e arriscado? Espiral: atravessa o rio pedra por pedra, testando antes de pisar."},
{"t": "Modelos", "q": "O modelo RAD se baseia principalmente em:", "o": ["Ciclo curto, reuso e equipes por módulo", "Fases longas, sequenciais e documentadas", "Protótipo descartável refinado com o cliente", "Análise de risco a cada volta do ciclo"], "e": "RAD exige requisitos bem entendidos e um sistema que possa ser dividido em módulos.", "m": "RAD = Rápido e Aproveitando peças: montar com LEGO pronto, cada equipe faz um bloco."},
{"t": "Modelos", "q": "No modelo Incremental, a primeira versão entregue normalmente é:", "o": ["O núcleo do produto", "Um protótipo descartável", "A documentação completa", "A versão final completa"], "e": "O Incremental entrega o núcleo primeiro e adiciona funções em versões seguintes.", "m": "Incremental é pizza por fatia: primeiro chega a fatia principal, o resto vem pedaço por pedaço."},
{"t": "Modelos", "q": "O FrequênciaFácil foi entregue em 2 sprints: primeiro a base e o CRUD de alunos, depois presença, histórico e deploy. Isso se aproxima mais de qual abordagem?", "o": ["Incremental e iterativa", "Cascata, em fases fixas", "Prototipação descartável", "Espiral, guiado por risco"], "e": "Cada sprint entregou uma parte funcionando sobre a anterior.", "m": "Cada sprint entregou uma fatia funcionando: isso é incremental. 'Fatia por fatia, a pizza fica inteira.'"},
{"t": "Modelos", "q": "Modelos evolutivos (Incremental e Espiral) são indicados quando:", "o": ["Os requisitos mudam ou o prazo é apertado", "Os requisitos são fixos desde o início", "O cliente não participa do projeto", "O sistema deve ser entregue de uma vez"], "e": "São iterativos: geram versões cada vez mais completas.", "m": "Evolutivo evolui junto com o requisito: o software cresce como Pokémon, versão por versão."},
{"t": "Ágil", "q": "Qual destes é um valor do Manifesto Ágil?", "o": ["Software funcionando mais que documentação abrangente", "Processos e ferramentas mais que indivíduos e interações", "Seguir um plano mais que responder a mudanças", "Negociação de contratos mais que colaboração com o cliente"], "e": "Os 4 valores: indivíduos e interações; software funcionando; colaboração com o cliente; responder a mudanças. As outras opções estão invertidas.", "m": "O lado esquerdo do manifesto sempre ganha: GENTE, SOFTWARE, CLIENTE e MUDANÇA."},
{"t": "Ágil", "q": "Ao dizer “software funcionando MAIS QUE documentação abrangente”, o manifesto quer dizer que:", "o": ["A documentação vale, mas o software funcionando vale mais", "A documentação é proibida em projetos que seguem o ágil", "A documentação só é feita depois que o projeto termina", "A documentação e o software têm exatamente o mesmo peso"], "e": "É “mais que”, não “no lugar de”. Os itens da direita continuam tendo valor.", "m": "'Mais que' não é 'no lugar de': prefiro pizza mais que salada, mas não proíbo a salada."},
{"t": "Ágil", "q": "Segundo os princípios ágeis, qual é a medida primária de progresso?", "o": ["Software funcionando", "Quantidade de documentos entregues", "Número de linhas de código", "Horas trabalhadas"], "e": "O que importa é software entregue e funcionando.", "m": "No ágil, progresso é software rodando, não papel sobrando."},
{"t": "Ágil", "q": "Como o ágil trata uma mudança de requisito no fim do desenvolvimento?", "o": ["Aceita, se trouxer vantagem ao cliente", "Rejeita, pois o escopo já foi fechado", "Aceita, mas só se não houver custo extra", "Adia para um novo projeto, obrigatoriamente"], "e": "Princípio ágil: aceitar mudanças de requisitos, mesmo tardias.", "m": "Ágil é GPS: errou a rua, ele recalcula a rota. Não te obriga a seguir o caminho errado até o fim."},
{"t": "Ágil", "q": "Metodologias ágeis são mais recomendadas para projetos com:", "o": ["Requisitos instáveis, equipe pequena e prazo curto", "Requisitos fixos, equipe grande e contrato rígido", "Requisitos fixos, equipe pequena e prazo longo", "Requisitos instáveis, equipe grande e prazo longo"], "e": "Ágil funciona quando há mudança, entregas curtas e desenvolvimento rápido é fundamental.", "m": "Muita mudança, time pequeno e pressa? O ágil é a resposta."},
{"t": "Ágil", "q": "Por que as metodologias ágeis surgiram?", "o": ["Excesso de documentação e pouca participação do cliente", "Falta de uma fase de manutenção no modelo Cascata", "Necessidade de substituir a UML nos projetos", "Falta de ferramentas de controle de versão"], "e": "O mercado passou a exigir sistemas complexos com requisitos mutáveis, e os modelos tradicionais não acompanhavam.", "m": "Tradicional = muito papel, pouca conversa, cliente longe. O ágil nasceu pra cortar a demora."},
{"t": "Ágil", "q": "Segundo o manifesto, qual é a forma mais eficiente de transmitir informação dentro do time?", "o": ["Conversa cara a cara", "Documentos formais assinados", "E-mails detalhados", "Relatórios semanais"], "e": "Interação direta entre pessoas é valorizada acima de processos e ferramentas.", "m": "Melhor que mil e-mails é um olho no olho."},
{"t": "Ágil", "q": "No ágil, “simplicidade” significa:", "o": ["Maximizar o trabalho que não precisou ser feito", "Minimizar a quantidade de testes escritos", "Usar uma única linguagem em todo o projeto", "Eliminar reuniões e cerimônias do processo"], "e": "Fazer só o que gera valor e evitar trabalho desnecessário.", "m": "Simplicidade é a arte de NÃO fazer o que não precisa. Menos é mais."},
{"t": "Ágil", "q": "Qual destes NÃO é uma metodologia ou abordagem ágil?", "o": ["Cascata", "XP", "Kanban", "Scrum"], "e": "Cascata é um modelo tradicional, sequencial.", "m": "Cascata desce em linha reta; ágil anda em ciclos curtos. Cascata é o oposto do ágil."},
{"t": "Scrum", "q": "No Scrum, quem é responsável por manter e priorizar o Product Backlog?", "o": ["Product Owner", "Scrum Master", "Scrum Team", "Cliente final"], "e": "O PO domina as regras de negócio e decide a ordem do que será feito.", "m": "PO = o dono do 'O QUÊ': decide o que entra e em que ordem. É quem escolhe o cardápio."},
{"t": "Scrum", "q": "Qual é o papel do Scrum Master?", "o": ["Ser o coach do time e zelar pelo Scrum", "Definir e priorizar o Product Backlog", "Programar as tarefas mais difíceis", "Aprovar o orçamento e os prazos"], "e": "Scrum Master é facilitador e coach, não chefe nem dono do backlog.", "m": "Scrum Master é o técnico do time, não o dono do clube: orienta e tira obstáculos, mas não manda."},
{"t": "Scrum", "q": "Quais são os três pilares do Scrum?", "o": ["Transparência, Inspeção e Adaptação", "Comunicação, Colaboração e Automação", "Planejamento, Codificação e Teste", "Requisitos, Projeto e Manutenção"], "e": "Transparência (status visível), Inspeção (acompanhar) e Adaptação (mudar o rumo). Comunicação/colaboração/automação são pilares do DevOps.", "m": "TIA do Scrum: Transparência, Inspeção, Adaptação. 'A TIA vê tudo, confere tudo e ajusta tudo.'"},
{"t": "Scrum", "q": "O que é uma sprint?", "o": ["Ciclo de tempo fixo que entrega um incremento", "Reunião que planeja o projeto do começo ao fim", "Lista de todos os requisitos do produto", "Momento em que o sistema vai para produção"], "e": "O produto é construído em sprints, que dividem um projeto grande em partes pequenas.", "m": "Sprint é corrida curta com linha de chegada marcada: no fim, entrega algo pronto."},
{"t": "Scrum", "q": "O que é definido na Sprint Planning?", "o": ["Meta e Sprint Backlog", "Acertos e erros da sprint", "Demonstração ao cliente", "Status diário do time"], "e": "Planning: a partir do Product Backlog, o time define a meta e gera o Sprint Backlog.", "m": "Planning é planejar a viagem: define o destino (meta) e arruma a mala (Sprint Backlog)."},
{"t": "Scrum", "q": "Na Daily Scrum, cada integrante responde:", "o": ["O que fiz ontem? O que farei hoje? Há algum obstáculo?", "Qual o orçamento? Qual o prazo? Qual o risco?", "O que deu certo? O que deu errado? O que melhorar?", "Quem é o cliente? O que ele quer? Por quê?"], "e": "A Daily alinha o time e expõe impedimentos. As perguntas sobre o que melhorar são da Retrospectiva.", "m": "Daily: ontem, hoje e o que atrapalha. Três perguntas, quinze minutos, todo dia."},
{"t": "Scrum", "q": "Em qual evento o incremento é mostrado às partes interessadas e o PO decide se ele será lançado?", "o": ["Sprint Review", "Sprint Planning", "Daily Scrum", "Sprint Retrospective"], "e": "Na Review o time mostra o que foi concluído e recebe feedback; mudanças voltam ao backlog.", "m": "Na Review, o cliente vê: é a vitrine do que foi feito."},
{"t": "Scrum", "q": "Qual a diferença entre Sprint Review e Sprint Retrospective?", "o": ["Review avalia o produto; Retrospectiva avalia o processo", "Review avalia o processo; Retrospectiva avalia o produto", "Review planeja a sprint; Retrospectiva demonstra o produto", "Review é diária; Retrospectiva acontece no fim do projeto"], "e": "Review = o que entregamos. Retrospectiva = como trabalhamos e o que melhorar.", "m": "Review olha o PRODUTO, Retro olha o PROCESSO. 'Review: o que fizemos. Retro: como fizemos.'"},
{"t": "Scrum", "q": "O Sprint Backlog é:", "o": ["Os itens escolhidos para a sprint atual", "Todos os requisitos do produto", "O gráfico do trabalho restante", "A parte entregue ao fim da sprint"], "e": "A lista completa é o Product Backlog; o que é entregue é o Incremento.", "m": "Product Backlog é o cardápio inteiro; Sprint Backlog é o que você pediu hoje."},
{"t": "Scrum", "q": "O que é o Incremento no Scrum?", "o": ["A parte do produto pronta na sprint", "A lista de itens escolhidos para a sprint", "O aumento de pessoas no time", "O registro de impedimentos do time"], "e": "É uma parte utilizável do produto, mesmo que o projeto todo ainda não esteja pronto.", "m": "Incremento é o tijolo pronto da sprint: a casa não acabou, mas aquele tijolo já está no lugar."},
{"t": "Scrum", "q": "No meio da sprint, o cliente pede uma função nova. O que deve acontecer, segundo o Scrum?", "o": ["Vai para o Product Backlog e o PO prioriza", "Vai para o Sprint Backlog e o time faz já", "O Scrum Master recusa, pois a sprint fechou", "O time para a sprint e replaneja tudo"], "e": "Mudanças entram no Product Backlog, em ordem de prioridade. É a Adaptação sem quebrar a meta da sprint.", "m": "Pedido novo no meio da sprint? Vai pra fila (Product Backlog) e o PO decide a vez."},
{"t": "Scrum", "q": "O Burndown Chart mostra:", "o": ["Trabalho restante x tempo", "Bugs por desenvolvedor", "Custo do projeto por mês", "Prioridade do backlog"], "e": "Compara uma linha ideal com o andamento real da sprint.", "m": "Burndown = 'queimar' o trabalho: a linha desce até zero, como a barra de vida do chefão no videogame."},
{"t": "Scrum", "q": "No FrequênciaFácil, o quadro do Trello com colunas Product Backlog, Sprint Backlog, Em Desenvolvimento, Em Revisão, Em Teste e Concluído é um exemplo de:", "o": ["Kanban", "Burndown Chart", "Diagrama de atividades", "Diagrama de implantação"], "e": "Kanban mostra o fluxo de trabalho (a fazer, fazendo, pronto) e dá transparência.", "m": "Kanban é o quadro de post-its: A fazer, Fazendo, Feito. Trello é Kanban."},
{"t": "História de usuário", "q": "Qual é o formato padrão de uma história de usuário?", "o": ["Como [papel], quero [ação], para que [benefício]", "Se [condição], então [resultado], senão [alternativa]", "Dado [contexto], o sistema [executa]", "Ator, caso de uso e extensão"], "e": "Como / quero / para que.", "m": "Como-Quero-Para: QUEM eu sou, O QUE eu quero, POR QUE eu quero."},
{"t": "História de usuário", "q": "Histórias de usuário capturam principalmente:", "o": ["Quem, o quê e por quê", "Como implementar o código", "Estrutura do banco de dados", "Prazo e orçamento do projeto"], "e": "É uma técnica de requisitos curta e simples, que cabe num cartão.", "m": "Quem, o quê e por quê: se cabe num post-it, é história de usuário."},
{"t": "História de usuário", "q": "No desenvolvimento ágil, as histórias de usuário servem como base para:", "o": ["Montar o Product Backlog", "Gerar o código automaticamente", "Substituir os testes", "Definir a infraestrutura"], "e": "Cada história vira um item do backlog que o PO prioriza.", "m": "Cada história vira item do backlog: as histórias montam o cardápio do produto."},
{"t": "História de usuário", "q": "Qual destas é uma história de usuário bem escrita para o FrequênciaFácil?", "o": ["Como professor, quero ver o histórico de um aluno, para acompanhar a frequência", "Como sistema, quero uma tabela presenca no MySQL, para guardar os registros", "Como desenvolvedor, quero usar PHP 8.3 e Docker, para rodar em qualquer lugar", "Como professor, quero um botão azul na tela, para ela ficar mais bonita"], "e": "Só a primeira tem papel, ação e benefício. As outras são tarefas técnicas ou detalhes de interface.", "m": "Sem 'como', 'quero' e 'para', é tarefa, não história."},
{"t": "História de usuário", "q": "Para que servem os critérios de aceite de uma história?", "o": ["Definir quando a história está pronta", "Definir quem vai programar a história", "Estimar quanto a história vai custar", "Definir em qual sprint ela entra"], "e": "No projeto, o PO validava os critérios de aceite antes de mover o card para Concluído.", "m": "Critério de aceite é o gabarito da prova: sem gabarito, não dá pra dizer que acertou."},
{"t": "História de usuário", "q": "Quem pode escrever histórias para requisitos NÃO funcionais (segurança, desempenho)?", "o": ["Os desenvolvedores também podem", "Somente o cliente", "Somente o Scrum Master", "Ninguém, histórias são só para requisitos funcionais"], "e": "Normalmente são escritas por ou para os usuários, mas devs podem expressar requisitos não funcionais assim.", "m": "Dev também escreve história: 'Como dev, quero HTTPS, para proteger os dados.'"},
{"t": "DevOps", "q": "DevOps é melhor definido como:", "o": ["Cultura que une Dev e Ops, com automação", "Cargo que cuida só dos servidores", "Ferramenta que automatiza o deploy", "Modelo sequencial parecido com o Cascata"], "e": "DevOps = filosofia cultural + práticas + ferramentas para entregar software com velocidade e qualidade.", "m": "DevOps = Dev + Ops de mãos dadas: quem constrói e quem mantém jogam no mesmo time."},
{"t": "DevOps", "q": "Qual problema o DevOps busca resolver?", "o": ["A distância entre quem desenvolve e quem opera", "A falta de linguagens de programação modernas", "A ausência de diagramas UML nos projetos", "O excesso de reuniões diárias do Scrum"], "e": "Dev e Ops trabalhando isolados causam atrasos e conflitos. DevOps une os dois com comunicação e automação.", "m": "Antes era 'jogar o código por cima do muro' e o Ops que se virasse. DevOps derruba o muro."},
{"t": "DevOps", "q": "Uma empresa instalou Jenkins e Docker, mas desenvolvimento e operação continuam sem conversar e sem objetivos comuns. Ela adotou DevOps?", "o": ["Não, falta a cultura de colaboração", "Sim, as ferramentas já são o DevOps", "Sim, desde que também use Kubernetes", "Não, falta adotar o Scrum antes"], "e": "Ferramentas apoiam, mas a base é comunicação e colaboração entre as equipes.", "m": "Comprar chuteira não te faz jogador: ferramenta sem cultura não é DevOps."},
{"t": "DevOps", "q": "Quais são os 4 pilares do DevOps?", "o": ["Comunicação, Colaboração, Automação e Monitoração", "Transparência, Inspeção, Adaptação e Automação", "Comunicação, Integração, Entrega e Implantação", "Planejamento, Código, Build e Monitoração"], "e": "Transparência/Inspeção/Adaptação são do Scrum; Plan/Code/Build/Test são etapas.", "m": "CCAM: 'Conversa, Coopera, Automatiza e Monitora.'"},
{"t": "DevOps", "q": "Por que a automação é considerada o “coração” do DevOps?", "o": ["Torna build, teste e entrega repetíveis", "Elimina a necessidade de pessoas no time", "Substitui o planejamento das entregas", "Dispensa o monitoramento em produção"], "e": "Automação traz ambientes estáveis e lançamentos assertivos, e encurta o caminho entre a ideia e a produção.", "m": "O que o robô repete, o humano não esquece. Automação é o coração: sem ela, o DevOps não bate."},
{"t": "DevOps", "q": "Qual o papel da Monitoração no DevOps?", "o": ["Detectar problemas e guiar melhorias", "Escrever o código das novas funções", "Aprovar os pull requests do time", "Planejar e priorizar o backlog"], "e": "Métricas e monitoramento mostram se o sistema está saudável e onde o processo pode melhorar.", "m": "Monitorar é o painel do carro: sem ele, você só descobre que acabou a gasolina quando o carro para."},
{"t": "DevOps", "q": "Qual é a ordem correta das etapas do ciclo DevOps?", "o": ["Plan, Code, Build, Test, Release, Deploy, Operate, Monitor", "Code, Plan, Test, Build, Deploy, Release, Monitor, Operate", "Plan, Test, Code, Deploy, Build, Release, Operate, Monitor", "Build, Code, Plan, Release, Test, Deploy, Monitor, Operate"], "e": "Planejar, codificar, construir, testar, liberar, implantar, operar, monitorar, e depois o ciclo recomeça.", "m": "'Planeja, Codifica, Constrói, Testa; Libera, Implanta, Opera, Vigia.' Primeiro faz, depois testa, depois entrega, depois cuida."},
{"t": "DevOps", "q": "Na etapa Build, o que acontece se um teste automatizado falhar?", "o": ["O pipeline para e o dev corrige", "O código segue com um aviso", "O teste falho é ignorado", "O monitoramento corrige sozinho"], "e": "Só código sem erros continua no pipeline. É o feedback rápido sobre falhas.", "m": "Build vermelha, tudo para: é o detector de metal do aeroporto, apitou, não embarca."},
{"t": "DevOps", "q": "Qual a diferença entre Release e Deploy?", "o": ["Release prepara a versão; Deploy a coloca em produção", "Release coloca em produção; Deploy prepara a versão", "Release planeja a versão; Deploy escreve o código", "Release monitora a versão; Deploy roda os testes"], "e": "Release = versão empacotada com as mudanças testadas. Deploy = implantação no ambiente.", "m": "Release é embrulhar o presente; Deploy é entregar na casa da pessoa."},
{"t": "DevOps", "q": "Integração Contínua (CI) é:", "o": ["Integrar sempre, com build e testes automáticos", "Publicar em produção sempre, sem aprovação", "Monitorar o servidor sem interrupção", "Integrar dev e ops em reuniões diárias"], "e": "CI consolida mudanças num ramo compartilhado e valida com testes de unidade e integração.", "m": "CI: 'Integra cedo, quebra pouco.' Junta o código toda hora e testa na hora."},
{"t": "DevOps", "q": "Por que integrar pequenas mudanças com frequência é melhor do que juntar tudo no fim?", "o": ["Os erros aparecem cedo e fáceis de achar", "Precisa de menos testes automatizados", "Dispensa o uso de controle de versão", "Dispensa a revisão de código no PR"], "e": "Mudança pequena = problema pequeno e fácil de localizar. Juntar tudo de uma vez dificulta encontrar a causa.", "m": "Louça lavada todo dia é rápido; deixar acumular a semana inteira vira pesadelo. Mudança pequena, problema pequeno."},
{"t": "DevOps", "q": "Este pipeline representa qual prática?", "d": "push na main\n    │\n    ▼\n[ CI: build + testes automáticos ]\n    │ passou\n    ▼\n[ testes de aceitação em pré-produção ]\n    │\n    ▼\n( APROVAÇÃO MANUAL )  ← alguém libera\n    │\n    ▼\n[ PRODUÇÃO ]", "o": ["Continuous Delivery (Entrega Contínua)", "Continuous Deployment (Implantação Contínua)", "Apenas Integração Contínua", "Modelo Cascata"], "e": "Entrega Contínua: o código está sempre pronto, mas a ida para produção depende de aprovação manual.", "m": "DELIVERY = a pizza fica pronta na porta, mas alguém precisa abrir (aprovação manual). Delivery: Deixa pronto."},
{"t": "DevOps", "q": "Este pipeline representa qual prática?", "d": "push na main\n    │\n    ▼\n[ CI: build + testes automáticos ]\n    │ passou\n    ▼\n[ deploy automático ]\n    │\n    ▼\n[ PRODUÇÃO ]   (ninguém aprova manualmente)", "o": ["Continuous Deployment (Implantação Contínua)", "Continuous Delivery (Entrega Contínua)", "Prototipação", "Apenas monitoramento contínuo"], "e": "Sem etapa manual entre o CI e a produção: Implantação Contínua.", "m": "DEPLOYMENT = entrega automática direto na mesa, ninguém abre a porta. Deployment: Despacha sozinho."},
{"t": "DevOps", "q": "Por que a Implantação Contínua depende tanto de testes automatizados confiáveis?", "o": ["Não há aprovação manual antes da produção", "Os testes substituem o monitoramento", "O Docker não funciona sem testes", "O cliente precisa ver os testes"], "e": "Exige investimento inicial em testes automatizados para garantir que só código bom chegue ao usuário.", "m": "Sem porteiro humano, o teste automatizado é o único segurança na porta."},
{"t": "DevOps", "q": "Para ter Entrega Contínua eficaz, o que precisa existir antes?", "o": ["Integração Contínua funcionando", "Implantação Contínua funcionando", "Um modelo Cascata documentado", "Um servidor físico dedicado"], "e": "A entrega contínua parte do código já validado pela CI.", "m": "Primeiro CI, depois CD: não dá pra entregar o que nem foi testado."},
{"t": "DevOps", "q": "O que é Continuous Testing (teste contínuo)?", "o": ["Testes automáticos em todas as etapas", "Testes manuais só no final do projeto", "Testes feitos pelo cliente em produção", "Testes automáticos só antes do deploy"], "e": "Testar cedo e sempre reduz o risco de o problema chegar ao usuário.", "m": "Testa cedo, testa sempre: é provar o tempero durante o preparo, não só no prato pronto."},
{"t": "DevOps", "q": "O que é Continuous Feedback (feedback contínuo)?", "o": ["Levar o efeito no usuário de volta ao time", "Enviar e-mail automático a cada commit", "Fazer a retrospectiva ao fim da sprint", "Registrar os logs de erro do servidor"], "e": "O feedback fecha o ciclo: o que aprendemos em produção alimenta o próximo planejamento.", "m": "Feedback contínuo é ler os comentários do cliente para a próxima receita sair melhor."},
{"t": "DevOps", "q": "O objetivo de Continuous Operations (operações contínuas) é:", "o": ["Manter o sistema no ar, mesmo ao atualizar", "Fazer deploy a cada commit, sem aprovação", "Monitorar o servidor e avisar sobre falhas", "Substituir a equipe de operações"], "e": "Atualizações e correções devem ser transparentes para o usuário.", "m": "Operação contínua é trocar o pneu com o carro andando: atualiza sem parar o sistema."},
{"t": "DevOps", "q": "Uma equipe faz deploy manual por FTP uma vez por mês, com dezenas de mudanças juntas. Quando quebra, demora a achar o erro. O que o DevOps recomenda?", "o": ["Entregas pequenas e frequentes, com CI/CD", "Entregas maiores e mais raras, com mais testes", "Congelar o sistema e proibir mudanças", "Mais pessoas cuidando do deploy por FTP"], "e": "Lotes pequenos e automação: menos risco por entrega e falhas fáceis de rastrear.", "m": "Lote grande, erro grande. 'Pouco e sempre' vence 'muito e às vezes'."},
{"t": "DevOps", "q": "Por que ter um ambiente de homologação (staging) antes da produção?", "o": ["Validar a versão num ambiente parecido com o real", "Guardar os backups das versões antigas do sistema", "Dar aos desenvolvedores um lugar para programar", "Rodar o banco de dados separado da produção"], "e": "Mudanças importantes são verificadas antes em outro ambiente, reduzindo o risco em produção.", "m": "Staging é o ensaio geral antes da estreia: erra no ensaio, não no palco."},
{"t": "DevOps", "q": "Qual problema o Docker resolve?", "o": ["O “funciona na minha máquina”", "Orquestrar centenas de containers", "Monitorar a CPU do servidor", "Gerenciar histórias de usuário"], "e": "Container leva o software inteiro com as dependências, evitando diferenças entre ambientes.", "m": "Docker é marmita: leva a comida e o tempero juntos e fica igual em qualquer lugar. Adeus 'na minha máquina funciona'."},
{"t": "DevOps", "q": "Qual a diferença entre Docker e Kubernetes?", "o": ["Docker roda containers; Kubernetes orquestra muitos", "Kubernetes roda containers; Docker orquestra muitos", "Docker monitora o servidor; Kubernetes roda testes", "Docker versiona código; Kubernetes planeja sprints"], "e": "Kubernetes gerencia containers em escala: rollouts, load balance, autoescala.", "m": "Docker é o contêiner; Kubernetes é o porto que organiza milhares de contêineres."},
{"t": "DevOps", "q": "Para que serve o controle de versão (Git/GitHub)?", "o": ["Registrar mudanças e trabalhar em equipe", "Executar o sistema em produção", "Monitorar o servidor da aplicação", "Gerar os diagramas UML do projeto"], "e": "Repositório, branches, commits e pull requests permitem colaborar com histórico completo.", "m": "Git é o Ctrl+Z do time, com nome e data de quem mexeu."},
{"t": "DevOps", "q": "No FrequênciaFácil, qual é a função do pull request antes do merge na main?", "o": ["Revisar a mudança antes de integrar", "Publicar a mudança direto em produção", "Apagar a branch depois do merge", "Rodar o deploy na VPS por SSH"], "e": "O PR passa por revisão e pelo CI. Só depois entra na main e dispara o CD.", "m": "Pull request é pedir pra alguém revisar a redação antes de entregar ao professor."},
{"t": "DevOps", "q": "Associe corretamente ferramentas e etapas do DevOps:", "o": ["Jira/Trello: Plan · GitHub: Code · Jenkins: Build · Selenium: Test · Docker: Deploy · Nagios: Monitor", "Jira: Test · GitHub: Monitor · Jenkins: Plan · Selenium: Deploy · Docker: Code · Nagios: Build", "Jira: Deploy · GitHub: Build · Jenkins: Monitor · Selenium: Plan · Docker: Test · Nagios: Code", "Jira: Code · GitHub: Plan · Jenkins: Test · Selenium: Monitor · Docker: Build · Nagios: Deploy"], "e": "Cada fase tem ferramentas típicas. No projeto: Trello, GitHub, GitHub Actions, PHPUnit, Docker e Netdata.", "m": "'Jira planeja, GitHub guarda, Jenkins constrói, Selenium testa, Docker entrega, Nagios vigia.'"},
{"t": "DevOps", "q": "Como DevOps e metodologias ágeis se relacionam?", "o": ["Se complementam: ágil organiza, DevOps entrega", "São opostos e não podem ser usados juntos", "DevOps substitui o Scrum nas empresas", "Ágil cuida da operação; DevOps do código"], "e": "DevOps expande o ágil até a produção. No projeto: Scrum no Trello + pipeline CI/CD.", "m": "Ágil faz o bolo em fatias; DevOps leva cada fatia até a mesa do cliente."},
{"t": "DevOps", "q": "No FrequênciaFácil, o CD só roda depois que o CI passa na main. Qual o principal benefício?", "o": ["Código quebrado não chega à produção", "Dispensa a revisão dos pull requests", "Dispensa o monitoramento em produção", "O deploy passa a ser feito à mão"], "e": "Se o CI falha, nada é publicado. É o portão de qualidade.", "m": "No nosso projeto: 'CI passou, CD liberou. CI falhou, nada publicou.'"},
{"t": "DevOps", "q": "No FrequênciaFácil, o endpoint /health e o Netdata pertencem a qual etapa do DevOps?", "o": ["Monitor", "Plan", "Code", "Build"], "e": "Monitor garante que infraestrutura e aplicação estão funcionando.", "m": "/health é o 'tá vivo?' do sistema: perguntou, respondeu 'ok', está de pé."},
{"t": "DevOps", "q": "Qual NÃO é um benefício do DevOps?", "o": ["Eliminar a necessidade de testes", "Entregas mais rápidas e frequentes", "Mais confiabilidade nas atualizações", "Melhor colaboração entre equipes"], "e": "DevOps depende ainda mais de testes, principalmente os automatizados.", "m": "DevOps não elimina teste, multiplica: quanto mais automático, mais teste."},

// ---------- estado ----------
const TOPICS=[...new Set(BANK.map(x=>x.t))];
const SIZES=[10,25,"Todas"];
let selTopics=new Set(TOPICS), selSize=25, run=[], i=0, picked=-1, answers=[];
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};

function renderStart(){
  $("topics").innerHTML="";
  TOPICS.forEach(t=>{const b=document.createElement("button");b.className="chip";b.textContent=t+" ("+BANK.filter(x=>x.t===t).length+")";
    b.setAttribute("aria-pressed",selTopics.has(t));b.onclick=()=>{selTopics.has(t)?selTopics.delete(t):selTopics.add(t);renderStart()};$("topics").appendChild(b)});
  $("sizes").innerHTML="";
  SIZES.forEach(s=>{const b=document.createElement("button");b.className="chip";b.textContent=s;b.setAttribute("aria-pressed",selSize===s);
    b.onclick=()=>{selSize=s;renderStart()};$("sizes").appendChild(b)});
  const n=BANK.filter(x=>selTopics.has(x.t)).length;
  $("avail").textContent=n?n+" questões disponíveis nos assuntos escolhidos.":"Escolha pelo menos um assunto.";
  $("go").disabled=!n;
}
function build(pool){
  return pool.map(x=>{const idx=shuffle([0,1,2,3]);return {...x,opts:idx.map(k=>x.o[k]),ans:idx.indexOf(0)}});
}
function begin(pool){
  run=pool;i=0;answers=[];
  show("quiz");renderQ();
}
function startNew(){
  let pool=shuffle(BANK.filter(x=>selTopics.has(x.t)));
  // garante questões com diagrama no simulado quando possível
  const n=selSize==="Todas"?pool.length:Math.min(selSize,pool.length);
  const diag=pool.filter(x=>x.d), rest=pool.filter(x=>!x.d);
  let pick=diag.slice(0,Math.min(2,n)); pick=pick.concat(rest.slice(0,n-pick.length));
  if(pick.length<n) pick=pick.concat(diag.slice(2,2+n-pick.length));
  begin(build(shuffle(pick)));
}
function show(id){["start","quiz","result"].forEach(s=>$(s).hidden=s!==id);window.scrollTo({top:0,behavior:"smooth"})}
function renderQ(){
  const q=run[i];picked=-1;
  $("qtopic").textContent=q.t;
  $("qcount").textContent="Questão "+(i+1)+" de "+run.length;
  $("qbar").style.width=(i/run.length*100)+"%";
  $("qtext").textContent=q.q;
  $("qdiag").hidden=!q.d; $("qdiag").textContent=q.d||"";
  $("qopts").innerHTML="";
  q.opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";
    b.innerHTML="<b>"+"ABCD"[k]+"</b><span></span>";b.querySelector("span").textContent=o;
    b.onclick=()=>{picked=k;[...$("qopts").children].forEach((c,j)=>c.classList.toggle("sel",j===k));$("confirm").disabled=false};
    $("qopts").appendChild(b)});
  $("qexp").hidden=true;$("confirm").hidden=false;$("confirm").disabled=true;$("next").hidden=true;
}
function confirmQ(){
  if(picked<0)return;
  const q=run[i],ok=picked===q.ans;
  answers.push({q,picked,ok});
  [...$("qopts").children].forEach((c,j)=>{c.disabled=true;c.classList.remove("sel");if(j===q.ans)c.classList.add("right");else if(j===picked)c.classList.add("wrong")});
  const ex=$("qexp");ex.hidden=false;ex.className="exp "+(ok?"ok":"no");
  ex.innerHTML="<strong></strong> <span></span>";
  ex.querySelector("strong").textContent=ok?"Acertou.":"Errou. Correta: "+"ABCD"[q.ans]+".";
  ex.querySelector("span").textContent=q.e;
  if(q.m){const t=document.createElement("div");t.className="tip";t.innerHTML="<b>Para lembrar</b><span></span>";t.querySelector("span").textContent=q.m;ex.appendChild(t)}
  $("confirm").hidden=true;$("next").hidden=false;
  $("next").textContent=i===run.length-1?"Ver resultado →":"Próxima →";
  $("qbar").style.width=((i+1)/run.length*100)+"%";
  $("next").focus();
}
function nextQ(){ if(i<run.length-1){i++;renderQ();window.scrollTo({top:0,behavior:"smooth"})} else finish() }
function finish(){
  if(!answers.length){show("start");renderStart();return}
  const hit=answers.filter(a=>a.ok).length,tot=answers.length,pct=Math.round(hit/tot*100);
  $("rscore").textContent=hit+"/"+tot;
  $("rpct").textContent=pct+"% de acerto";
  $("rmsg").textContent=pct>=85?"Excelente, está pronto para a prova.":pct>=70?"Bom resultado. Revise os erros abaixo e faça mais uma rodada.":"Vale revisar o resumo nos assuntos com mais erros e refazer as erradas.";
  const by={};answers.forEach(a=>{by[a.q.t]=by[a.q.t]||[0,0];by[a.q.t][1]++;if(a.ok)by[a.q.t][0]++});
  $("rstats").innerHTML="";Object.entries(by).forEach(([t,[h,n]])=>{const d=document.createElement("div");d.className="stat";
    d.innerHTML="<strong></strong><br><span class='muted'></span>";d.querySelector("strong").textContent=t;d.querySelector("span").textContent=h+" de "+n;$("rstats").appendChild(d)});
  const errs=answers.filter(a=>!a.ok);
  $("redo").hidden=!errs.length;
  const box=$("rerrs");box.innerHTML="";
  if(!errs.length){box.innerHTML="<p><strong>Nenhum erro.</strong> Gabaritou essa rodada.</p>"}
  else{const h=document.createElement("h2");h.textContent="Revise os erros ("+errs.length+")";box.appendChild(h);
    errs.forEach(a=>{const d=document.createElement("div");d.className="err";
      d.innerHTML="<span class='tag'></span><strong></strong><span style='color:var(--bad)'></span><span style='color:var(--ok)'></span><span class='muted'></span><div class='tip'><b>Para lembrar</b><span></span></div>";
      const s=d.children;s[5].querySelector("span").textContent=a.q.m||"";s[0].textContent=a.q.t;s[1].textContent=a.q.q;s[2].textContent="Sua resposta: "+a.q.opts[a.picked];s[3].textContent="Correta: "+a.q.opts[a.q.ans];s[4].textContent=a.q.e;box.appendChild(d)})}
  show("result");
}
$("go").onclick=startNew;
$("confirm").onclick=confirmQ;
$("next").onclick=nextQ;
$("quit").onclick=finish;
$("again").onclick=()=>{show("start");renderStart()};
$("redo").onclick=()=>begin(build(shuffle(answers.filter(a=>!a.ok).map(a=>BANK.find(b=>b.q===a.q.q)))));
renderStart();
</script>
